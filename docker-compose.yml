version: "3.9"

services:
  # ─── MQTT Broker ────────────────────────────────────────────────
  broker:
    image: eclipse-mosquitto:2.0
    container_name: smartbin-broker
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    networks:
      - smartbin-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Producer ───────────────────────────────────────────────────
  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: smartbin-producer
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - smartbin-net
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: "smartbin-broker"   # Quoted and using container_name
      MQTT_PORT: "1883"
      MQTT_TOPIC: "smartbin/bin-01/pir-01/events"
      MQTT_STATUS_TOPIC: "smartbin/bin-01/pir-01/status"
      DEVICE_ID: "urn:dev:team03:pir-01"
      MOCK: "true"
      SAMPLE_INTERVAL: "0.1"
      COOLDOWN: "2.0"
      MIN_HIGH: "0.1"
      QOS: "1"
      VERBOSE: "true"
    restart: unless-stopped

  # ─── Consumer ───────────────────────────────────────────────────
  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: smartbin-consumer
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - smartbin-net
    environment:
      PYTHONUNBUFFERED: "1"
      MQTT_BROKER: "smartbin-broker"   # Quoted and using container_name
      MQTT_PORT: "1883"
      MQTT_TOPIC: "smartbin/bin-01/pir-01/events"
      QOS: "1"
      VERBOSE: "true"
    volumes:
      - events-data:/app/output
    restart: unless-stopped

volumes:
  mosquitto-data:
  events-data:

networks:
  smartbin-net:
    driver: bridge